name: tests

# 为什么要有 CI
#
#   这一版发布时带着 4 条红叉出去了。
#
#   原因很简单：我的测试都是本地手动跑的，
#   而"手动跑"的意思是——有时候忘了跑。
#
#   有人拉下来跑，发现 4 条失败，其中 1 条是真的。
#   他指出的不是安全能力问题，是工程缺口：
#
#       「最该补的不是更多载荷，是 CI。」
#
#   他说得对。
#
#   这个 workflow 要做的事：
#       · 每次 push / PR 都在干净环境跑一遍
#       · 两个平台都跑（Windows 和 Linux）
#         因为很多"漏洞"其实是平台差异——比如 D:/ 在 Linux 上
#         不是绝对路径，在 Windows 上是。只测一个平台会漏。
#       · 红叉就不许合

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false        # 一个平台挂了，另一个也要跑完
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # 可选依赖缺失时相关格式会跳过，不该让 CI 挂。
      # 但装一下能覆盖到文档解析那部分。
      - name: 装可选依赖（失败不阻塞）
        continue-on-error: true
        run: |
          python -m pip install python-docx openpyxl python-pptx pypdf

      # ⚠️ PySide6 单独一步，**失败要阻塞**。
      #
      #    为什么要装它：
      #        tests/test_desktop_boots.py 会把桌面端真的建出来，
      #        切一遍四个页面。没有 PySide6 那条会跳过 ——
      #        等于桌面端拆坏了 CI 也不知道。
      #
      #        2026-11-02 拆 desktop/app.py 时连着崩了三次：
      #            QWidget 没 import       → 窗口开不了
      #            ServiceCard 没 import   → 服务页崩
      #            _userdirs 没 import     → 环境页崩
      #        全都是静态检查看不出来、只有真建窗口才炸的。
      #
      #    代价：多下 200-300MB，CI 慢一两分钟。
      #    不装的代价：界面坏了没人知道 —— 那更贵。
      #
      #    ⚠️ 失败要阻塞（没有 continue-on-error）：
      #       装不上就该知道，而不是静默跳过测试。
      - name: 装 PySide6（桌面端测试要用）
        run: |
          python -m pip install PySide6


      # ⚠️ Linux 上还要装系统库。
      #
      #    2026-11-03 CI 实测：
      #        PySide6 装上了，但 import 就炸 ——
      #        ImportError: libEGL.so.1: cannot open shared object file
      #
      #    GitHub 的 ubuntu runner 是精简版，没有 GUI 运行时库。
      #    Qt 的 QApplication 一 import 就要 libEGL，没有就挂，
      #    5 条桌面端测试全 ERROR（连窗口都没建出来）。
      #
      #    Windows runner 自带这些，所以只在 Linux 上装。
      - name: 装 Qt 的系统库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # 无显示器环境下 Qt 要用 offscreen 平台。
      # 测试文件里也设了默认值，这里再设一次是保险。
      - name: 设 Qt 无头模式
        shell: bash
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      # ⚠️ 失败时把日志写进 job summary。
      #
      #    2026-11-01 那次推送，Windows 上两个 Python 版本都红了，
      #    而本机跑了三遍（含模拟干净环境）都是绿的。
      #
      #    想看 CI 日志得下载 job log，那个接口要 admin 权限 ——
      #    也就是说：**CI 红了，作者不一定知道为什么。**
      #
      #    现在失败时把最后 200 行写进 summary，网页上直接能看，
      #    不用 token、不用下载。
      # ⚠️ 打环境信息。
      #
      #    2026-11-01 那次 Windows 两个版本都红了，
      #    而我在本机复刻了三种环境（真实 / 假 APPDATA / 假 TEMP）都是绿的，
      #    说明差在我造不出来的东西上 —— 最可能是 Windows Server 2022
      #    跟 Windows 10/11 的差别。
      #
      #    这一版留着，下次再红能一眼看出环境差在哪。
      # ⚠️ 把 TEMP 改回 Windows 路径。
      #
      #    GitHub 的 Windows runner 用 bash（MINGW64）跑，
      #    $TEMP 被 MSYS 转成了 /tmp —— 那是 POSIX 路径。
      #
      #    这个应用是 Windows 原生程序，它靠 TEMP 建临时 .bat 来跑命令：
      #        tempfile.mkstemp()  →  拿到 /tmp/xxx.bat  →  失败
      #        →  cmd 起不来  →  所有跑命令的测试全挂（退出码 4294967295）
      #
      #    实测（CI 截图）：temp 是 /tmp，Windows 上 11 条挂，Ubuntu 全过。
      #    本机 TEMP 是 C:\Users\...\Temp，所以一直是绿的。
      #
      #    改法：用 runner 的 RUNNER_TEMP（GitHub 给的正规临时目录，
      #    是 Windows 路径），写进 GITHUB_ENV 让后面的步骤都用它。
      #
      #    只在 Windows 上改；Ubuntu 上 /tmp 是正确的。
      - name: 把 TEMP 改成 Windows 路径（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          if (-not $t) { $t = Join-Path $env:USERPROFILE 'AppData\Local\Temp' }
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          "TEMP=$t"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$t"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TEMP 改成 $t"

      - name: 环境信息
        shell: bash
        run: |
          {
            echo '## 环境'
            echo ''
            echo '```'
            uname -a || true
            echo "python: $(python -V 2>&1)"
            echo "which python: $(which python)"
            echo "os: $RUNNER_OS $RUNNER_ARCH"
            echo "temp: ${TEMP:-unset}"
            echo "appdata: ${APPDATA:-unset}"
            echo "userprofile: ${USERPROFILE:-unset}"
            echo "username: ${USERNAME:-unset}"
            echo ''
            echo '--- cmd /c echo hi ---'
            cmd //c echo hi 2>&1 || true
            echo '--- 版本 ---'
            cat VERSION || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时把失败的那几条名字打出来（日志拿不到，但名字能拿到）
      - name: 跑回归测试
        shell: bash
        run: |
          set +e
          python tests/run_all.py 2>&1 | tee /tmp/reg.log
          rc=${PIPESTATUS[0]}
          set -e

          # 日志留给下一步上传（job log 那个接口拿不到，
          # 302 到 Azure Blob 之后令牌不被认；artifact 是另一条路）
          mkdir -p ci-artifacts
          cp /tmp/reg.log ci-artifacts/reg.log 2>/dev/null || true

          if [ "$rc" -ne 0 ]; then
            {
              echo "## 回归测试失败（退出码 $rc）"
              echo ""
              echo '```'
              tail -200 /tmp/reg.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # ⚠️ 把失败的测试名打成 annotation。
            #
            #    job 日志要登录态才看得到，但 annotation 不用 ——
            #    API 的 check-runs 接口就能读到。
            #    所以这里把 FAILED 那几行挑出来，逐条打。
            grep -E '^(FAILED|tests/.*FAILED)' /tmp/reg.log 2>/dev/null | head -20 | while read -r L; do
              echo "::error::$L"
            done
            # ⭐ 再抓一条汇总行：`失败模块：A, B, C`
            #
            #   上面那条 grep 抓的是 `FAILED: xxx`（run_all.py 打的），
            #   但汇总行一眼能看到**全部**失败的模块名，更适合当 annotation。
            #
            #   2026-11-03：a59e69f 在 ubuntu 上红了，
            #   annotation 只有一个 exit code 1 —— 因为当时 run_all.py
            #   打的是「失败模块：」而不是「FAILED:」，两条 grep 都对不上。
            #   现在两边都抓，哪条格式变了都不至于瞎。
            grep -E '^\s*失败模块：' /tmp/reg.log 2>/dev/null | head -3 | while read -r L; do
              echo "::error::$L"
            done
            # ⭐ 抓断言详情 —— 只说'哪个模块挂了'不够，要知道**为什么**挂。
            #
            #   run_all.py 失败时会打：
            #       ---- 引擎核心 失败详情 ----
            #       ...pytest 的 traceback（最后 40 行）...
            #
            #   这里把里面最关键的几行挑出来：
            #       E   AssertionError: ...   ← pytest 的断言说明
            #       E   assert ...            ← 实际值 vs 期望值
            #       tests/xxx.py:NNN: in ...  ← 哪条测试
            #
            #   不抓全部（annotation 太多会刷屏），只抓前 20 条。
            grep -E '^\s+(E\s+(AssertionError|assert)|Failed:|[A-Za-z]*Error:)’ /tmp/reg.log 2>/dev/null | head -20 | while read -r L; do
              echo "::error::$L"
            done
            # 再打一条汇总，防止一条 FAILED 都没有（比如崩在收集阶段）
            if ! grep -q "^FAILED" /tmp/reg.log 2>/dev/null; then
              echo "::error::回归测试失败但没有 FAILED 行，看 summary 里的最后 200 行"
            fi
            exit "$rc"
          fi

      - name: 跑红队测试
        shell: bash
        run: |
          # 红队脚本自己会因为"我们不同意的 6 条"返回 1，
          # 所以不能直接看它的退出码。
          #
          # 判据：把已知不同意的条目过滤掉，看还剩不剩失败。
          #
          # 用 bash 是为了两个平台行为一致
          # （Windows runner 上也有 bash，来自 Git for Windows）。
          set +e
          python tests/redteam_ext.py . > /tmp/rt.log 2>&1
          rc=$?
          set -e

          cat /tmp/rt.log
          mkdir -p ci-artifacts
          cp /tmp/rt.log ci-artifacts/redteam.log || true

          KNOWN="::ffff:127.0.0.1|提示注入未绕过闸门"
          REAL=$(grep -c '^\s*·' /tmp/rt.log 2>/dev/null || true)
          REAL=${REAL:-0}
          FILTERED=$(grep '^\s*·' /tmp/rt.log 2>/dev/null | grep -vE "$KNOWN" | wc -l || true)

          echo "--- 红队统计 ---"
          echo "失败条目：$REAL ，其中白名单外：$FILTERED"

          if [ "$FILTERED" -gt 0 ]; then
            echo "::error::红队有 $FILTERED 条白名单外的真失败"
            exit 1
          fi

          # 没打印"合计"说明脚本崩了
          if ! grep -q '合计' /tmp/rt.log; then
            echo "::error::红队脚本没跑完（没有合计行），退出码 $rc"
            exit 1
          fi

          echo "红队通过（$REAL 条失败全在我们明确不同意的白名单里）"
          
          mkdir -p ci-artifacts
          cp /tmp/rt.log ci-artifacts/redteam.log || true


      # 用真实载荷打守卫，看挡不挡得住。
      # 跟回归测试是两回事：那些测函数返回对不对，
      # 这个测能不能被绕过。
      - name: 跑暴力攻击测试
        shell: bash
        run: |
          set +e
          python tests/brute_force.py 2>&1 | tee /tmp/bf.log
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p ci-artifacts
          cp /tmp/bf.log ci-artifacts/brute_force.log 2>/dev/null || true
          exit "$rc"

      # 这一步比上面几步都重要。
      #
      #   单元测试和攻击测试都是逻辑对不对。
      #   它们证明不了这个项目能不能跑起来：
      #   桥能不能 dispatch、引擎能不能真的写文件、
      #   会话能不能存盘、文件锁在这个平台上会不会崩。
      #
      #   这一步不调真模型（用照剧本回话的假模型），
      #   但工具调用是真的，文件操作是真的，锁是真的。
      #   整条链路跑一遍，看能不能跑完。
      - name: 冒烟测试（整条链路真跑一遍）
        shell: bash
        run: |
          set +e
          python tests/smoke.py 2>&1 | tee /tmp/smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p ci-artifacts
          cp /tmp/smoke.log ci-artifacts/smoke.log 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            {
              echo "## 冒烟测试失败（退出码 $rc）"
              echo ""
              echo '```'
              tail -200 /tmp/smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: ci-artifacts/
          if-no-files-found: ignore
