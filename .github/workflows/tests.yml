name: tests

# 为什么要有 CI
#
#   这一版发布时带着 4 条红叉出去了。
#
#   原因很简单：我的测试都是本地手动跑的，
#   而"手动跑"的意思是——有时候忘了跑。
#
#   有人拉下来跑，发现 4 条失败，其中 1 条是真的。
#   他指出的不是安全能力问题，是工程缺口：
#
#       「最该补的不是更多载荷，是 CI。」
#
#   他说得对。
#
#   这个 workflow 要做的事：
#       · 每次 push / PR 都在干净环境跑一遍
#       · 两个平台都跑（Windows 和 Linux）
#         因为很多"漏洞"其实是平台差异——比如 D:/ 在 Linux 上
#         不是绝对路径，在 Windows 上是。只测一个平台会漏。
#       · 红叉就不许合

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false        # 一个平台挂了，另一个也要跑完
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # 可选依赖缺失时相关格式会跳过，不该让 CI 挂。
      # 但装一下能覆盖到文档解析那部分。
      - name: 装可选依赖（失败不阻塞）
        continue-on-error: true
        run: |
          python -m pip install python-docx openpyxl python-pptx pypdf

      # ⚠️ 失败时把日志写进 job summary。
      #
      #    2026-11-01 那次推送，Windows 上两个 Python 版本都红了，
      #    而本机跑了三遍（含模拟干净环境）都是绿的。
      #
      #    想看 CI 日志得下载 job log，那个接口要 admin 权限 ——
      #    也就是说：**CI 红了，作者不一定知道为什么。**
      #
      #    现在失败时把最后 200 行写进 summary，网页上直接能看，
      #    不用 token、不用下载。
      # ⚠️ 打环境信息。
      #
      #    2026-11-01 那次 Windows 两个版本都红了，
      #    而我在本机复刻了三种环境（真实 / 假 APPDATA / 假 TEMP）都是绿的，
      #    说明差在我造不出来的东西上 —— 最可能是 Windows Server 2022
      #    跟 Windows 10/11 的差别。
      #
      #    这一版留着，下次再红能一眼看出环境差在哪。
      - name: 环境信息
        shell: bash
        run: |
          {
            echo '## 环境'
            echo ''
            echo '```'
            uname -a || true
            echo "python: $(python -V 2>&1)"
            echo "which python: $(which python)"
            echo "os: $RUNNER_OS $RUNNER_ARCH"
            echo "temp: ${TEMP:-unset}"
            echo "appdata: ${APPDATA:-unset}"
            echo "userprofile: ${USERPROFILE:-unset}"
            echo "username: ${USERNAME:-unset}"
            echo ''
            echo '--- cmd /c echo hi ---'
            cmd //c echo hi 2>&1 || true
            echo '--- 版本 ---'
            cat VERSION || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时把失败的那几条名字打出来（日志拿不到，但名字能拿到）
      - name: 跑回归测试
        shell: bash
        run: |
          set +e
          python tests/run_all.py 2>&1 | tee /tmp/reg.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            {
              echo "## 回归测试失败（退出码 $rc）"
              echo ""
              echo '```'
              tail -200 /tmp/reg.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      # ⚠️ 红队脚本单独跑一遍，跟 run_all 里那次是两层保险。
      #
      #    run_all.py 里跑 redteam_ext，但它自己的白名单是维护着的；
      #    万一哪天有人把关键条目加进 known，run_all 就会变绿，
      #    而这一步不会 —— 它看着脚本的原始结果。
      #
      #    判据：把明确不同意的条目过滤掉，看还剩不剩失败。
      #    用 bash 是为了两个平台行为一致
      #    （Windows runner 上也有 bash，来自 Git for Windows）。
      - name: 跑红队测试
        shell: bash
        run: |
          # 红队脚本自己会因为"我们不同意的 6 条"返回 1，
          # 所以不能直接看它的退出码。
          #
          # 判据：把已知不同意的条目过滤掉，看还剩不剩失败。
          #
          # 用 bash 是为了两个平台行为一致
          # （Windows runner 上也有 bash，来自 Git for Windows）。
          set +e
          python tests/redteam_ext.py . > /tmp/rt.log 2>&1
          rc=$?
          set -e

          cat /tmp/rt.log

          KNOWN="::ffff:127.0.0.1|提示注入未绕过闸门"
          REAL=$(grep -c '^\s*·' /tmp/rt.log 2>/dev/null || true)
          REAL=${REAL:-0}
          FILTERED=$(grep '^\s*·' /tmp/rt.log 2>/dev/null | grep -vE "$KNOWN" | wc -l || true)

          echo "--- 红队统计 ---"
          echo "失败条目：$REAL ，其中白名单外：$FILTERED"

          if [ "$FILTERED" -gt 0 ]; then
            echo "::error::红队有 $FILTERED 条白名单外的真失败"
            exit 1
          fi

          # 没打印"合计"说明脚本崩了
          if ! grep -q '合计' /tmp/rt.log; then
            echo "::error::红队脚本没跑完（没有合计行），退出码 $rc"
            exit 1
          fi

          echo "红队通过（$REAL 条失败全在我们明确不同意的白名单里）"

      - name: 跑暴力攻击测试
        run: python tests/brute_force.py

      # ⚠️ 这一步比上面两步都重要。
      #
      #    单元测试和攻击测试都是"逻辑对不对"。
      #    它们证明不了"这个项目能不能跑起来"——
      #    桥能不能 dispatch、引擎能不能真的写文件、
      #    会话能不能存盘、文件锁在这个平台上会不会崩。
      #
      #    这一步是：不调真模型（用一个照剧本回话的假模型），
      #    但工具调用是真的，文件操作是真的，锁是真的。
      #    整条链路跑一遍，看能不能跑完。
      #
      #    这就是"测试过了"和"跑得起来"之间的那道坎。
      - name: 冒烟测试（整条链路真跑一遍）
        run: python tests/smoke.py
